name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Get current version
        id: current-version
        run: echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Bump version
        id: new-version
        run: |
          npm version ${{ github.event.inputs.bump }} --no-git-tag-version
          echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT

      - name: Commit version change
        run: |
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.new-version.outputs.version }}"

      - name: Create tag
        run: |
          git tag -a "v${{ steps.new-version.outputs.version }}" -m "Release v${{ steps.new-version.outputs.version }}"

      - name: Push changes and tag
        run: |
          git push
          git push --tags

      - name: Summary
        run: |
          echo "✅ Version bumped from ${{ steps.current-version.outputs.version }} to ${{ steps.new-version.outputs.version }}"
          echo "🏷️  Tag created: v${{ steps.new-version.outputs.version }}"
